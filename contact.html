<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="img/nighter/common/icon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/nighter/common/icon.png" sizes="180x180">
    <link rel="icon" type="image/png" href="img/nighter/common/icon.png" sizes="192x192">
    <script src="./js/scripts.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./js/contact.js"></script>
    <title>ナイター｜お問い合わせ</title>
</head>
<body class="subpage">
    <header>
        <div class="headerContents">
            <a href="/">
                <img src="./img/nighter/common/logo-white.png" alt="Nighter" class="logo">
            </a>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="nav-menu">
                <a href="https://about.night-er.com/#top" class="nav-item current">トップ</a>
                <a href="https://about.night-er.com/#about" class="nav-item">ナイターとは</a>
                <a href="https://about.night-er.com/#feature" class="nav-item">特徴</a>
                <a href="https://about.night-er.com/#jobs" class="nav-item">お仕事の例</a>
                <a href="https://about.night-er.com/#how-to" class="nav-item">使い方</a>
                <a href="https://about.night-er.com/#faq" class="nav-item">よくある質問</a>
                <a href="https://about.night-er.com/#news" class="nav-item">お知らせ</a>
                <a href="https://about.night-er.com/#get-app" class="nav-item">使ってみる</a>
                <a href="../business" class="business-btn">店舗様はこちら</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="page-header">
            <div class="page-header-inner">
                <div class="page-heading">
                    <h1>Contact</h1>
                    <p>お問い合わせ</p>
                </div>
                <nav class="breadcrumb">
                <a href="/">トップページ</a>
                <span>&gt;</span>
                <span>お問い合わせ</span>
                </nav>
            </div>
        </div>
        <section id="contact">
            <div class="contactContents">
                <form id="contact-form" class="contact-form">
                    <div class="form-group">
                        <label for="user_name">お名前 <span class="required">必須</span></label>
                        <input type="text" id="user_name" name="user_name" placeholder="山田 太郎" required>
                    </div>
                    <div class="form-group">
                        <label for="user_email">メールアドレス <span class="required">必須</span></label>
                        <input type="email" id="user_email" name="user_email" placeholder="taro.yamada@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="user_phone">電話番号 <span class="required">必須</span></label>
                        <input type="tel" id="user_phone" name="user_phone" placeholder="090-1234-5678">
                    </div>
                    <div class="form-group">
                        <label for="message">お問い合わせ内容 <span class="required">必須</span></label>
                        <textarea id="message" name="message" rows="6" placeholder="お問い合わせ内容をご入力ください" required></textarea>
                    </div>
                    <div class="form-submit">
                        <button type="submit" id="submit-btn">
                            <span class="btn-text">送信する</span>
                            <span class="btn-loading" style="display: none;">
                                <i class="fa-solid fa-spinner fa-spin"></i> 送信中...
                            </span>
                        </button>
                    </div>
                </form>
                <div id="form-message" class="form-message" style="display: none;"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="footerContents">
            <div class="footerLeft">
                <div class="footer-logo-placeholder">
                    <p class="footer-copy">
                        <span class="footer-copy-sub"><span>夜</span><span>の</span><span class="footer-copy-accent"><span>ス</span><span>キ</span><span>マ</span><span>バ</span><span>イ</span><span>ト</span></span><span>は</span></span>
                        <img src="./img/nighter/common/logo-white.png" alt="Nighter" class="logo">
                    </p>
                </div>
            </div>
            <div class="footerCenter">
                <h2>その他メニュー</h2>
                <nav>
                    <a href="https://about.night-er.com/info">運営情報</a>
                    <a href="https://about.night-er.com/contact">お問い合わせ</a>
                    <a href="https://about.night-er.com/terms">利用規約</a>
                    <a href="https://about.night-er.com/privacy">プライバシーポリシー</a>
                </nav>
            </div>
            <div class="footerRight">
                <a href="../business" class="business-btn">店舗様はこちら</a>
            </div>
        </div>
    </footer>
</body>
</html>
